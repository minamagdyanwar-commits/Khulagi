*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ff,"Amiri","Noto Naskh Arabic","Segoe UI",Tahoma,serif);-webkit-text-size-adjust:100%}
body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
header.top{display:none}
main{max-width:980px;margin:0 auto;padding:0 0 90px}
.banner{position:relative;height:170px;overflow:hidden;color:#fff;background:radial-gradient(circle at 50% 30%,rgba(255,244,214,.95) 0,rgba(255,226,160,.55) 22%,rgba(0,0,0,0) 48%),linear-gradient(135deg,#a8651a,#e0a34a 45%,#9a5a14);display:flex;align-items:flex-end}
.banner .cr{position:absolute;inset:0;display:grid;place-items:center;font-size:7.5rem;color:rgba(255,255,255,.28);line-height:1;pointer-events:none}
.banner .cr.l{place-items:center start;padding-inline-start:20px;font-size:4.6rem;color:rgba(255,255,255,.18)}
.banner .cr.r{place-items:center end;padding-inline-end:20px;font-size:4.6rem;color:rgba(255,255,255,.18)}
.banner h1{position:relative;margin:0;padding:0 18px 12px;font-size:2.2rem;text-shadow:0 2px 10px rgba(0,0,0,.45);font-weight:700}
.burger{position:absolute;top:calc(10px + env(safe-area-inset-top));inset-inline-end:14px;width:44px;height:44px;display:grid;place-items:center;font-size:2rem;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.opts{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;padding:12px 10px 8px;direction:rtl}
.opts label{display:flex;align-items:center;gap:6px;font-size:1.15rem;cursor:pointer;user-select:none}
.opts input{width:26px;height:26px;accent-color:#f08a3c}
.sbtn{border:2px solid #d12a2a;color:#c01818;background:#f4eded;border-radius:12px;padding:12px 20px;font-size:1rem;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.selw{position:relative;margin:10px 14px 8px}
.selw select{width:100%;appearance:none;-webkit-appearance:none;background:#4f4fa8;color:#fff;border:3px solid #1f4fd8;border-radius:8px;padding:14px 62px 14px 14px;font:inherit;font-size:1.2rem;direction:rtl}
.selw select option,.selw select optgroup{background:#fff;color:#000}
.selw::after{content:"▼";position:absolute;left:12px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;background:#fff;color:#1fa8ff;display:grid;place-items:center;font-size:.9rem;pointer-events:none}
.selw select{padding:14px 14px 14px 58px;text-align:right;text-align-last:right}
.rd{padding:0 6px}
.rub{text-align:center;color:#d01010;font-size:calc(var(--fs)*.9);margin:14px 8px 6px;line-height:1.9}
.row{display:grid;grid-template-columns:repeat(var(--n,3),1fr);margin:0;border-block-end:0}
.row .who{grid-column:1/-1;text-align:center;font-size:.8rem;color:var(--acc);padding:2px 6px}
.row.za{background:var(--za)}.row.zb{background:var(--zb)}
:root{--za:rgba(255,255,255,.02);--zb:rgba(255,255,255,.14)}
:root[data-theme=church],:root[data-theme=parchment],:root[data-theme=light]{--za:rgba(0,0,0,.02);--zb:rgba(120,90,40,.16)}
:root[data-theme=night],:root[data-theme=forest],:root[data-theme=royal],:root[data-theme=churchnight]{--za:rgba(255,255,255,.02);--zb:rgba(255,255,255,.12)}
/* speaker backgrounds disabled for now: .row.sp-pr */
/* speaker backgrounds disabled for now: .row.sp-di */
/* speaker backgrounds disabled for now: .row.sp-pe */
/* speaker label colors disabled */
:root{--sp-pr:#6E5214;--sp-prb:#F2D27A;--sp-di:#1F4A8C;--sp-dib:#9DC2FF;--sp-pe:#1E6B43;--sp-peb:#8FE3AE}
:root[data-theme=church],:root[data-theme=parchment],:root[data-theme=light]{--sp-pr:#EDCB6B;--sp-prb:#7A5A10;--sp-di:#A9C7F2;--sp-dib:#1F4E9E;--sp-pe:#A5DDB4;--sp-peb:#1B6B3F}
.cell{padding:8px 8px;line-height:1.9;font-size:calc(var(--fs)*.78);border-inline-start:2px solid var(--ink);min-width:0;overflow-wrap:anywhere}
.cell:first-of-type{border-inline-start:0}
.ar{direction:rtl;text-align:right;color:var(--c-ar);font-size:calc(var(--fs)*.95)}
.tr{direction:rtl;text-align:right;color:var(--c-tr);font-size:calc(var(--fs)*.92)}
.cop{direction:ltr;text-align:left;font-family:CopticNoto,"Noto Sans Coptic",serif;color:var(--c-cop);font-size:calc(var(--fs)*.74);line-height:1.8}
.row>.cell:last-child{border-inline-end:0}
.pgm{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:.75rem;margin:12px 0 2px}
.pgm::before,.pgm::after{content:"";flex:1;height:1px;background:var(--line)}
sup.fn{color:var(--acc);font-weight:700;cursor:pointer;font-size:.62em;padding:0 2px;font-family:system-ui}
.pager{display:flex;gap:10px;margin:20px 14px 0}
.pager button{flex:1;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:700}
.pager button[disabled]{opacity:.35}
.pending{margin:14px;padding:14px;border:1px dashed var(--line);border-radius:12px;color:var(--mute);text-align:center;font-size:.95rem}
.empty{text-align:center;color:var(--mute);padding:36px 16px;margin:14px;border:1px dashed var(--line);border-radius:16px}
.empty b{display:block;color:var(--ink);font-size:1.15rem;margin-bottom:6px}
.hint{color:var(--mute);font-size:.85rem;margin:6px 14px 14px}
mark{background:rgba(240,138,60,.4);color:inherit;border-radius:3px}
/* home & navigation */
.home{padding:10px 14px 0}
.home h2,.gh h2{margin:8px 2px 12px;font-size:1.25rem;color:var(--acc)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 10px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;min-height:118px;box-shadow:var(--shadow)}

.card.big{min-height:132px}.card.big b{font-size:1.25rem}
.sec{border-inline-start:4px solid var(--acc)}
.card b{font-size:1.1rem;line-height:1.5}
.card small{color:var(--mute);font-size:.82rem}
.card.cont{grid-column:1/-1;flex-direction:row;justify-content:space-between;text-align:right;min-height:0;padding:14px 16px;border-color:var(--acc)}
.card.cont small{display:block}
.crumb{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px 0;direction:rtl}
.crumb button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:.95rem}
.gh{padding:4px 14px 0}
.list{margin:0 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sec{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;padding:14px;border-bottom:1px solid var(--line);text-align:right}
.list .sec:last-child{border-bottom:0}
.dd{display:grid;grid-template-columns:1fr;gap:10px;padding:0 14px 12px}.dd label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--mute)}.dd select{padding:10px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-size:1rem;font-family:inherit}.dd select:disabled{opacity:.55}
.lets{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 12px;direction:rtl}
.lets button{min-width:46px;padding:7px 11px;border:1.5px solid var(--line);border-radius:999px;background:var(--card);font-size:1.05rem;display:inline-flex;align-items:baseline;justify-content:center;gap:4px}
.lets button small{font-size:.65rem;color:var(--mute)}
.lets button.on{background:var(--acc);color:#fff}
.lets button.on small{color:inherit;opacity:.85}

:root[data-theme^=church] .lets button small{color:#d8c9a3}

.med{margin:4px 10px 12px}
.medb{display:flex;align-items:center;gap:8px;width:100%;border:1.5px solid var(--line);border-radius:12px;padding:7px 12px;font-size:.9rem;background:var(--card2);color:var(--ink);text-align:right}
.medb .mbi{white-space:nowrap;color:var(--acc);font-weight:700}
.medb .mbt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.medb .mbc{color:var(--mute)}
.medbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 12px 0;font-size:.85rem;color:var(--mute)}
.medbar span{flex:1}
.medbar button{border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--card2);color:var(--ink)}
:root[data-theme^=church] .medbar{color:#d8c9a3}
:root[data-theme^=church] .medbar button{background:rgba(235,203,126,.1);color:var(--gold-hi);border-color:var(--gold)}
.medc{margin-top:8px;padding:12px 14px;border:1px dashed var(--line);border-radius:14px;background:var(--card2);color:var(--ink);line-height:2}
.medc h4{margin:0 0 4px;color:var(--acc);font-size:1.1rem}
.medc p{margin:4px 0}
.medc .mv{color:var(--mute);font-size:.9rem}
.medc .mp{color:var(--acc)}
.medc .ms{display:block;margin-top:6px;color:var(--mute);font-size:.75rem}
.sec .sub{display:block;color:var(--mute);font-size:.8rem;margin-top:2px}
.sec .pn{color:var(--mute);font-size:.85rem;white-space:nowrap}
.sec.soon{opacity:.55}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--ink);font:inherit;font-size:1.05rem;margin-bottom:10px;direction:rtl}
/* sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:none}
.scrim.on{display:block}
.sheet{position:fixed;inset-inline:0;bottom:0;z-index:50;background:var(--card);border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto;transform:translateY(105%);transition:transform .25s;box-shadow:var(--shadow);max-width:860px;margin:0 auto}
.sheet.on{transform:none}
.lsw{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0}.lsw small{color:var(--mute)}.lsb{padding:7px 14px;border:1.5px solid var(--acc);border-radius:999px;background:var(--card2);color:var(--ink);font:inherit;font-size:.9rem;font-weight:700;cursor:pointer}:root[data-theme^=church] .lsb{border-color:var(--gold)}
.sheet.drawer{inset:0 auto 0 0;width:min(258px,92vw);max-height:none;border-radius:0 18px 18px 0;border:1px solid var(--line);border-top:0;transform:translateX(-105%);padding:0 10px calc(14px + env(safe-area-inset-bottom))}
.sheet.drawer.on{transform:none}
.sth{position:sticky;top:0;z-index:2;background:var(--card);display:flex;align-items:center;justify-content:space-between;padding:12px 4px 10px;font-weight:700;font-size:1.1rem;color:var(--ink)}
.stx{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card2);color:var(--ink);font-size:1rem}
.stg{border:1px solid var(--line);border-radius:12px;background:var(--card2);margin:0 0 10px;overflow:hidden}
.stgh{display:flex;width:100%;align-items:center;justify-content:space-between;padding:13px 14px;background:transparent;border:0;color:var(--ink);font:inherit;font-weight:700;font-size:.98rem;cursor:pointer}
.stgc{transition:transform .2s;color:var(--lk)}
.stg.open .stgc{transform:rotate(180deg)}
.stgb{display:none;padding:2px 14px 12px;border-top:1px dashed var(--line)}
.stg.open .stgb{display:block}
.stl{margin:12px 0 6px;font-size:.85rem;color:var(--mute,var(--ink));font-weight:700}
.stgb .set:last-child{border-bottom:0}
.sheet.drawer .sw button{border-radius:10px;padding:7px 11px}
.sheet.drawer{font-size:13px;padding:0 8px calc(10px + env(safe-area-inset-bottom))}
.sheet.drawer .sth{font-size:1rem;padding:8px 2px 8px}
.sheet.drawer .stx{width:28px;height:28px;font-size:.85rem}
.sheet.drawer .stg{margin-bottom:7px;border-radius:10px}
.sheet.drawer .stgh{padding:9px 10px;font-size:.9rem}
.sheet.drawer .stgb{padding:0 10px 8px}
.sheet.drawer .stl{margin:8px 0 4px;font-size:.78rem}
.sheet.drawer .sw{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.sheet.drawer .sw button{padding:6px 4px;font-size:.78rem;border-width:1.5px;line-height:1.3}
.sheet.drawer .set{padding:6px 0;gap:8px;font-size:.84rem;line-height:1.4}
.sheet.drawer .tg{width:38px;height:22px}
.sheet.drawer .tg::after{width:16px;height:16px;top:3px;inset-inline-start:3px}
.sheet.drawer .tg.on::after{inset-inline-start:19px}
.sheet.drawer .fsr{justify-content:center;gap:8px}
.sheet.drawer .fsr button{width:34px;height:34px;font-size:.95rem}
.sheet.drawer .ksb{padding:6px 10px;font-size:.8rem;width:100%;text-align:center;box-sizing:border-box}
.sheet.drawer .set:has(.ksb){flex-direction:column;align-items:stretch}
.sheet.drawer .hint{font-size:.76rem;line-height:1.7;margin:6px 0}


.sheet h3{margin:0 0 10px;color:var(--acc)}
.sheet .nt{line-height:2;font-size:1.02rem}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.set:last-child{border:0}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{padding:8px 12px;border-radius:999px;border:2px solid var(--line);background:var(--card2);font-size:.9rem}
.sw button.on{border-color:var(--acc);color:var(--acc);font-weight:700}
.tg{width:48px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none}
.tg::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:var(--ink);transition:.2s}
.tg.on{background:var(--acc)}
.tg.on::after{inset-inline-start:23px}
.fsr{display:flex;align-items:center;gap:10px}
.fsr button{width:40px;height:40px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:1.1rem}
.toast{position:fixed;bottom:24px;inset-inline:0;margin:auto;width:max-content;max-width:90%;background:var(--card2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:60;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s}
.toast.on{opacity:1}

<script src="data.js"></script>
<script>
(function(){
"use strict";
var D=window.KHULAGI, $=function(s,e){return (e||document).querySelector(s)};
var DEF={mode:"auto",tl:"parchment",td:"dawn",stc:true,story:true,resume:true,ml:"line",wh:"strip",story:true,hm:"path",ff:"amiri",vref:true,guide:true,mov:true,today:true,calm:false,wake:false,swipe:true,rm:"unit",mp:"sheet",hide:[],hv:"p",lit:"bas",dn:"n",slim:true,hqo:false,theme:"church",fs:22,cop:true,ar:true,tr:true,pg:false,rub:true,notes:true,med:true,medAll:"closed"};
var S=Object.assign({},DEF);

var TRM={"ⲁ":"ا","ⲃ":"ڤ","ⲅ":"غ","ⲇ":"د","ⲉ":"ي","ⲍ":"ز","ⲏ":"ي","ⲑ":"ث","ⲓ":"ي","ⲕ":"ك","ⲗ":"ل","ⲙ":"م","ⲛ":"ن","ⲝ":"كس","ⲟ":"و","ⲡ":"ب","ⲣ":"ر","ⲥ":"س","ⲧ":"ت","ⲩ":"ي","ⲫ":"ف","ⲭ":"خ","ⲯ":"بس","ⲱ":"و","ϣ":"ش","ϥ":"ف","ϧ":"خ","ϩ":"ه","ϫ":"ج","ϭ":"تش","ϯ":"تي"};
var TRW={"ⲡⲟ̅ⲥ̅":"إبشويس","ⲡⲟⲥ":"إبشويس","ⲡⲭ̅ⲥ̅":"بي إخرستوس","ⲡⲭⲥ":"بي إخرستوس","ⲓⲏ̅ⲥ̅":"إيسوس","ⲓⲏⲥ":"إيسوس","ⲫϯ":"إفنوتي","ⲡⲉⲛϭⲟⲓⲥ":"بينتشويس","ⲡⲉⲛⲛⲟⲩϯ":"بيننوتي","ⲫ̀ⲛⲏⲃ":"إفنيڤ","ⲫⲛⲏⲃ":"إفنيڤ","ⲡⲁϭⲟⲓⲥ":"باتشويس","ⲉⲗⲉⲏⲥⲟⲛ":"إليسون","ⲕⲩⲣⲓⲉ":"كيريي"};
var VOW="ⲁⲉⲏⲓⲟⲱⲩ",SOFT="ⲉⲏⲓⲩ";
function trWord(w){var k=w.toLowerCase();if(TRW[k])return TRW[k];
  var x=k.replace(/[̀-̄̆-ͯ]/g,"").replace(/̅/g,"");if(TRW[x])return TRW[x];
  var o="",i=0,n=x.length;
  while(i<n){var c=x[i],d=x[i+1],e=x[i+2];
    if(c==="ⲟ"&&d==="ⲩ"){o+=(i===0?"أو":"و");i+=2;continue}
    if(c==="ⲅ"&&d==="ⲅ"){o+="ن";i++;continue}
    if(c==="ⲅ"&&d&&"ⲕⲝⲭ".indexOf(d)>-1){o+="ن";i++;continue}
    if(c==="ⲅ"){o+=(d&&SOFT.indexOf(d)>-1?"ج":"غ");i++;continue}
    if((c==="ⲁ"||c==="ⲉ"||c==="ⲏ")&&d==="ⲩ"){
      var vow=e&&VOW.indexOf(e)>-1;
      if(vow)o+=(c==="ⲁ"?"ا":(i===0&&c==="ⲉ"?"إي":"ي"))+"ڤ";
      else o+=(c==="ⲁ"?"اڤ":(i===0?"إف":(c==="ⲏ"?"إيف":"يف")));
      i+=2;continue}
    if(i===0){if(c==="ⲉ"){o+="إ";i++;continue}if(c==="ⲏ"){o+="إي";i++;continue}if(c==="ⲟ"||c==="ⲱ"){o+="أو";i++;continue}}
    o+=(TRM[c]!==undefined?TRM[c]:c);i++}
  return o}
function trLine(t){return t.replace(/[\u2C80-\u2CFF\u03E2-\u03EF\u0300-\u036F]+/g,trWord)}
function load(){try{var j=JSON.parse(localStorage.getItem("khulagi.settings")||"{}");S=Object.assign({},DEF,j)}catch(e){}}
function save(){try{localStorage.setItem("khulagi.settings",JSON.stringify(S))}catch(e){}}
function lastGet(){try{return localStorage.getItem("khulagi.last")}catch(e){return null}}
function lastSet(v){try{localStorage.setItem("khulagi.last",v);localStorage.setItem("khulagi.lastts",String(Date.now()))}catch(e){}}
function seenGet(){try{return JSON.parse(localStorage.getItem("khulagi.seen")||"{}")}catch(e){return {}}}
function seenSet(id){try{var m=seenGet();if(!m[id]){m[id]=1;localStorage.setItem("khulagi.seen",JSON.stringify(m))}}catch(e){}}
function effMode(){var m=S.mode||"auto";if(DMon())return"dark";if(m==="auto")m=(window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches)?"light":"dark";return m}
function DMon(){return typeof DM!=="undefined"&&DM}
function effTheme(){return effMode()==="light"?(S.tl||"parchment"):(S.td||"dawn")}
function apply(){var r=document.documentElement;S.theme=effTheme();r.setAttribute("data-theme",S.theme);r.setAttribute("data-mode",effMode());r.style.colorScheme=effMode();r.style.setProperty("--fs",S.fs+"px");r.setAttribute("data-hv",S.hv);r.setAttribute("data-ds","d1");S.ff&&S.ff!=="amiri"?r.setAttribute("data-ff",S.ff):r.removeAttribute("data-ff");r.setAttribute("data-dn",S.dn);r.setAttribute("data-slim",S.slim?"true":"false");
  var m=document.querySelector('meta[name=theme-color]');if(m){var c=getComputedStyle(r).getPropertyValue("--bg").trim();if(c)m.content=c}}

var SECS=[],BYID={},LOADED={};
function parse(txt){
  var cur=null,mode=0,who=null,it=null,sp="";
  txt.split("\n").forEach(function(l){
    if(l.indexOf("## ")===0){var p=l.slice(3).split("|");cur=D.content[p[0].trim()]={range:(p[1]||"").trim(),notes:{},items:[]};mode=0;who=null;sp="";return}
    if(!cur)return;
    if(l==="%"){mode=mode===0?1:0;return}
    if(mode===0&&l.charAt(0)==="~"){var mm=l.match(/^~(\w): ?(.*)$/),li=cur.items[cur.items.length-1];if(mm&&li){(li.med=li.med||{})[mm[1]]=mm[2]}return}
    if(mode===1){var m=l.match(/^(\d+): (.*)$/);if(m)cur.notes[m[1]]=m[2];return}
    if(l.indexOf("# ")===0){it=null;cur.items.push({k:"pg",n:l.slice(2).trim()});return}
    if(l.indexOf("! ")===0){it=null;if(!who)sp="";cur.items.push({k:"r",t:l.slice(2)});return}
    if(l.indexOf("@ ")===0){who=l.slice(2);sp=who.indexOf("الكاهن")>=0?"pr":who.indexOf("الشماس")>=0?"di":who.indexOf("الشعب")>=0?"pe":"";return}
    if(l.indexOf("t: ")===0){if(it)it.tr=l.slice(3);return}
    if(l.indexOf("c: ")===0||l.indexOf("a: ")===0){
      var isC=l[0]==="c";
      if(!it||(isC&&it.cop!==undefined)||(!isC&&it.ar!==undefined)){it={k:"p",sp:sp};if(who){it.who=who;who=null};cur.items.push(it)}
      if(isC)it.cop=l.slice(3);else it.ar=l.slice(3);return}
    if(l.trim()===""){it=null}
  });
}
function ensure(gid){
  var gg=D.groups.filter(function(x){return x.id===gid})[0];if(gg&&gg.file)gid=gg.file;
  if(LOADED[gid])return LOADED[gid];
  LOADED[gid]=fetch("content-"+gid+".txt").then(function(r){if(!r.ok)throw 0;return r.text()}).then(parse).catch(function(){});
  return LOADED[gid];
}
function ensureAll(){return Promise.all(D.groups.map(function(g){return ensure(g.id)}))}
D.groups.forEach(function(g){g.sections.forEach(function(s){s.group=g;s.has=false;SECS.push(s);BYID[s.id]=s})});

function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function norm(t){return String(t).replace(/[ً-ٰٟـ̀-ͯ]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").toLowerCase()}
function fnify(t,q){var h=esc(t);if(q)h=hl(h,q);return h.replace(/\[\^(\d+)\]/g,'<sup class="fn" data-n="$1">$1</sup>')}
function hl(h,q){if(!q)return h;try{var re=new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");return h.replace(re,"<mark>$1</mark>")}catch(e){return h}}

var app=$("#app"),pick=$("#pick");
function opts(){
  var d=[["ar","ع","عربي"],["tr","م","معرب"],["cop","ق","قبطي"]];
  $("#opts").innerHTML=d.map(function(x){return '<label title="'+x[2]+'"><input type="checkbox" data-o="'+x[0]+'"'+(S[x[0]]?' checked':'')+'><span>'+x[1]+'</span></label>'}).join("")+'<button class="sbtn" id="btnSearch" aria-label="بحث">🔎</button>';
  $("#btnSearch").addEventListener("click",openSearch);
}
$("#opts").addEventListener("change",function(e){var k=e.target.getAttribute("data-o");if(!k)return;
  S[k]=e.target.checked;save();route()});
function toast(t){var x=$("#toast");x.textContent=t;x.classList.add("on");setTimeout(function(){x.classList.remove("on")},2200)}
function fillPick(){
  var h="";D.groups.forEach(function(g){h+='<optgroup label="'+esc(g.title)+'">';g.sections.forEach(function(s){h+='<option value="'+s.id+'">'+esc(s.title)+(s.has?'':' — قريبًا')+'</option>'});h+='</optgroup>'});
  pick.innerHTML=h;
}
pick.addEventListener("change",function(){go(pick.value)});

function medHtml(it){var m=it.med;if(!m||!S.med)return'';
  var op=S.medAll==="open";
  var h='<div class="med"><button class="medb" data-med="1" aria-expanded="'+op+'"><span class="mbi">💭 '+(m.k?esc(m.k):'تأمل')+'</span><span class="mbt">'+(m.t?esc(m.t):'')+'</span><span class="mbc">'+(op?'▴':'▾')+'</span></button><div class="medc"'+(op?'':' hidden')+'>';
  if(m.t)h+='<h4>'+esc(m.t)+'</h4>';
  if(m.v)h+='<p class="mv">'+esc(m.v)+'</p>';
  if(m.r)h+='<p class="mr_">'+esc(m.r)+'</p>';
  if(m.p)h+='<p class="mp"><b>🙏 صلاة</b>'+esc(m.p)+'</p>';
  if(m.x)h+='<p class="mx"><b>✍ تدريب</b>'+esc(m.x)+'</p>';
  h+='<div class="msrc'+(m.z?' bk':'')+'"><b>'+(m.z?'📖 المصدر:':'المصدر:')+'</b> '+(m.z?esc(m.z):'الكتاب المقدس ونص الصلاة، بصياغة مسوّدة')+'</div>';
  h+='<small class="ms">'+(m.s==='reviewed'?'مراجَع':'مسوّدة — تحتاج مراجعة كنسية')+'</small></div></div>';return h}
/* ---------- وضع المتابعة: قطعة قطعة ---------- */
var CUR={id:null,u:0},UT="a",SH=1,UC={};
function wc(t){return (t||"").split(/\s+/).filter(Boolean).length}
function umap(){try{return JSON.parse(localStorage.getItem("khulagi.unit")||"{}")}catch(e){return {}}}
function usave(id,u){try{var m=umap();m[id]=u;localStorage.setItem("khulagi.unit",JSON.stringify(m))}catch(e){}}
function unitsOf(id){
  if(UC[id])return UC[id];var c=D.content[id];if(!c)return null;
  var MIN=80,turns=[],cur=null,pend=[];
  c.items.forEach(function(it){
    if(it.k!=="p"||isExp(it)){pend.push(it);return}
    var key=it.sp||"";
    if(!cur||it.who||key!==cur.sp){cur={sp:key,items:pend.slice(),w:0};pend=[];turns.push(cur)}
    else if(pend.length){pend.forEach(function(x){cur.items.push(x)});pend=[]}
    cur.items.push(it);cur.w+=wc(it.ar)});
  if(!turns.length)return null;
  if(pend.length)pend.forEach(function(x){turns[turns.length-1].items.push(x)});
  var out=[],acc=null;
  turns.forEach(function(t){
    if(!acc){acc={items:t.items.slice(),w:t.w,sps:[t.sp]};return}
    if(acc.w<MIN){acc.items=acc.items.concat(t.items);acc.w+=t.w;acc.sps.push(t.sp)}
    else{out.push(acc);acc={items:t.items.slice(),w:t.w,sps:[t.sp]}}});
  if(acc){if(out.length&&acc.w<MIN/2){var l=out[out.length-1];l.items=l.items.concat(acc.items);l.w+=acc.w}else out.push(acc)}
  out.forEach(function(u){
    u.med=u.items.filter(function(i){return i.k==="p"&&i.med});
    u.rub=u.items.filter(function(i){return i.k==="r"});
    var nn={};u.items.forEach(function(i){var t=(i.ar||"")+" "+(i.t||"");t.replace(/\[\^(\d+)\]/g,function(m,n){nn[n]=1})});
    u.notes=Object.keys(nn);
    var f=u.items.filter(function(i){return i.k==="p"})[0];u.head=f?plain(f.ar||f.cop||"").split(/\s+/).slice(0,7).join(" "):"";
    var sn={pr:"الكاهن",di:"الشماس",pe:"الشعب"};var ss=[];u.sps.forEach(function(x){if(x&&ss.indexOf(sn[x])<0)ss.push(sn[x])});u.who=ss.join(" · ")});
  UC[id]=out;return out}
function isExp(it){return it&&it.k==="p"&&!!it.ar&&!it.cop&&!it.tr}
function expHtml(it,q){return '<div class="exp"><span class="expl">شرح</span>'+fnify(it.ar,q).replace(/ \/ /g,'<br>')+'</div>'}
function rowHtml(it,cols,isDox,st,q){
  if(isExp(it))return expHtml(it,q);
  var zc="";if(isDox&&!it.sp){zc=(st.alt++%2)?' zb':' za'}
  var h='<div class="row'+(it.sp?' sp-'+it.sp:'')+zc+'">';
  if(it.who)h+='<div class="who">'+esc(it.who)+'</div>';
  cols.forEach(function(k){
    if(k==="ar")h+='<div class="cell ar">'+(it.ar?fnify(it.ar,q).replace(/ \/ /g,'<br>'):'')+'</div>';
    else if(k==="tr")h+='<div class="cell tr">'+(it.tr?(q?hl(esc(it.tr),q):esc(it.tr)):(it.cop?esc(trLine(it.cop)):''))+'</div>';
    else h+='<div class="cell cop">'+(it.cop?(q?hl(esc(it.cop),q):esc(it.cop)):'')+'</div>'});
  return h+'</div>'}
function cnt(n){return '<span class="cnt" dir="ltr">('+String(n).replace(/\d/g,function(d){return "٠١٢٣٤٥٦٧٨٩"[d]})+')</span>'}
function plain(t){return String(t).replace(/<[^>]*>/g,"").replace(/\[\^\d+\]/g,"")}
function unitParts(id,s,c,us,u,q,cols){
  var U=us[u],n=us.length,isDox=s.group.id==="dox",st={alt:0},pct=Math.round((u+1)/n*100);
  var si=(S.story!==false&&window.KST)?storyIdx(id):-1,few=U.med.length<=2;
  var inner=(si>=0?stripHtml(si):'')+'<div class="unh"><span>القطعة '+ar9(u+1)+' من '+ar9(n)+(U.who?' · '+esc(U.who):'')+'</span><span class="unhb"><button data-whc="1" class="whb'+(S.wh!=="off"?' on':'')+'" aria-label="همسات الصلاة">🕊</button><button data-live="1" aria-label="وضع الكنيسة">🕯</button><button data-uidx="1" aria-label="فهرس القطع">فهرس ▾</button></span></div><div class="unb"><i style="width:'+pct+'%"></i></div>';
  var sheetMed=S.med&&U.med.length&&S.mp!=="after";
  var tabs=[["a","النص"]];
  if(sheetMed)tabs.push(["b","💭 تأمل"+(U.med.length>1?" "+cnt(U.med.length):"")]);
  if(S.rub&&U.rub.length)tabs.push(["c","🕯 "+cnt(U.rub.length)]);
  if(U.notes.length)tabs.push(["d","📎 "+cnt(U.notes.length)]);
  if(si>=0&&S.story)tabs.push(["s","📖 المحطة"]);
  if(window.KS)tabs.push(["g","📖 دليل"]);
  var tab=tabs.some(function(t){return t[0]===UT})?UT:"a";
  var th='<div class="dtabs" id="untabs" role="tablist">'+tabs.map(function(t){return '<button role="tab" data-ut="'+t[0]+'" class="'+(t[0]===tab?'on':'')+'" aria-selected="'+(t[0]===tab)+'">'+t[1]+'</button>'}).join("")+'</div>';
  var tx='<div class="rd" style="--n:'+Math.max(cols.length,1)+'">';
  U.items.forEach(function(it){
    if(it.k==="pg"){if(S.pg)tx+='<div class="pgm">ص '+it.n+'</div>'}
    else if(it.k==="r"){if(S.rub)tx+='<button class="rubi" data-ut="c" title="اضغط لمعنى الحركة">'+esc(plain(it.t))+'</button>'}
    else{tx+=rowHtml(it,cols,isDox,st,q)+(it.med?layersHtml(it,few,sheetMed):'')}});
  tx+='</div>';
  if(S.med&&U.med.length&&S.mp==="after"){
    U.med.forEach(function(it){var ctx=(U.med.length===1?U.head:plain(it.ar||"").split(/\s+/).slice(0,9).join(" "));tx+='<div class="unq">'+(U.med.length===1?'تأمل في هذه القطعة':'تأمل في')+': «'+esc(ctx)+'…»</div>'+medHtml(it).replace('<div class="medc" hidden>','<div class="medc">').replace('aria-expanded="false"','aria-expanded="true"').replace('▾','▴')})}
  tx+=noteHtml(id,u);
  var nsx=nextSecId(id,1);
  if(nsx)tx+='<button class="nsec" data-nsec="'+nsx+'"><small>إلى فقرة</small><b>'+esc(BYID[nsx].title)+'</b><small>التالية ‹</small></button>';
  inner+='<div class="unp" data-up="a">'+tx+'</div>';
  var body='';
  if(tab==="b"){U.med.forEach(function(it){var ctx=plain(it.ar||"").split(/\s+/).slice(0,10).join(" ");body+='<div class="unq">«'+esc(U.med.length===1?U.head:ctx)+'…»</div>'+medHtml(it).replace('<div class="medc" hidden>','<div class="medc">').replace('aria-expanded="false"','aria-expanded="true"').replace('▾','▴')})}
  else if(tab==="c"){U.rub.forEach(function(it){body+=(window.KS?KS.rub(it.t,fnify(it.t,q)):'<div class="rub">'+fnify(it.t,q)+'</div>')})}
  else if(tab==="d"){body='<div class="unn">';U.notes.forEach(function(k){if(c.notes[k])body+='<p><sup class="fn" data-n="'+k+'">'+k+'</sup> '+(window.KS?KS.linkRefs(esc(c.notes[k])):esc(c.notes[k]))+'</p>'});body+='</div>'}
  else if(tab==="s"&&si>=0){body=sceneHtml(si)}
  else if(tab==="g"&&window.KS){body=KS.guide(id,s,c).replace('<details class="kg">','<details class="kg" open>')}
  return {tabs:th,inner:inner,body:body,h:tab==="a"?0:(SH||1)}}
function ar9(x){return String(x).replace(/\d/g,function(d){return "٠١٢٣٤٥٦٧٨٩"[d]})}
function unitView(id,s,c,us,u,q,cols){
  var p=unitParts(id,s,c,us,u,q,cols);
  return '<div class="unm" id="unm"><div class="unmi" id="unmi">'+p.inner+'</div></div><div class="dsheet" id="dsheet" data-h="'+p.h+'"><div class="dgrab" id="dgrab" role="button" aria-label="الدرج السفلي"></div>'+p.tabs+'<div class="dbody" id="dbody">'+p.body+'</div></div>'}
function unmEl(){return document.getElementById("unm")}
function setUnit(u,noscroll){
  var id=CUR.id,s=BYID[id],c=D.content[id],us=unitsOf(id);if(!s||!c||!us)return false;
  if(u<0||u>=us.length)return false;
  var cols=[];if(S.ar)cols.push("ar");if(S.tr)cols.push("tr");if(S.cop)cols.push("cop");
  CUR.u=u;usave(id,u);if(u>=us.length-1)seenSet(id);
  var m=document.getElementById("unmi");if(!m)return false;
  var p=unitParts(id,s,c,us,u,"",cols);
  m.innerHTML=p.inner;sheetApply(p);
  if(!noscroll)fixScroll();return true}
function sheetApply(p){
  var t=document.getElementById("untabs"),d=document.getElementById("dbody"),sh2=document.getElementById("dsheet");if(!t||!d||!sh2)return;
  var tmp=document.createElement("div");tmp.innerHTML=p.tabs;t.replaceWith(tmp.firstChild);
  d.innerHTML=p.body;sh2.setAttribute("data-h",p.h)}
function sheetRefresh(){
  var id=CUR.id,s=BYID[id],c=D.content[id],us=unitsOf(id);if(!s||!c||!us)return;
  var cols=[];if(S.ar)cols.push("ar");if(S.tr)cols.push("tr");if(S.cop)cols.push("cop");
  sheetApply(unitParts(id,s,c,us,CUR.u,"",cols))}
function fixScroll(){var m=unmEl();if(!m)return;var th=(document.getElementById("topbar")||{}).offsetHeight||0,top=m.getBoundingClientRect().top+window.scrollY-60-(document.documentElement.getAttribute("data-pg")==="r"?th:0);if(window.scrollY>top)window.scrollTo(0,Math.max(0,top))}
function reader(id,q,u){
  var s=BYID[id];if(!s){return}
  pick.value=id;document.title=s.title+" — الخولاجي";var tt=document.getElementById("bsub");if(tt){tt.textContent=s.title;tt.hidden=false}
  var c=D.content[id],h='';
  var cols=[];if(S.ar)cols.push("ar");if(S.tr)cols.push("tr");if(S.cop)cols.push("cop");
  var us=(S.rm==="unit"&&c&&!q)?unitsOf(id):null;
  if(us){if(u===undefined||u===null){u=umap()[id];if(typeof u!=="number")u=0}if(u<0||u>=us.length)u=u<0?us.length-1:0;CUR={id:id,u:u};usave(id,u)}else CUR={id:id,u:0};

function seasonOf(d,cd){
  var y=d.getFullYear(),t=Date.UTC(y,d.getMonth(),d.getDate()),a=y%4,b=y%7,c=y%19,dd=(19*c+15)%30,e=(2*a+4*b-dd+34)%7,mo=Math.floor((dd+e+114)/31),dy=(dd+e+114)%31+1,E=Date.UTC(y,mo-1,dy+13),off=Math.round((t-E)/864e5),m=cd.m,k=cd.d,out=[];
  var F={"0-1":"عيد النيروز · رأس السنة القبطية","0-17":"عيد الصليب المجيد","3-29":"عيد الميلاد المجيد","4-11":"عيد الغطاس المجيد","6-29":"عيد البشارة","2-21":"عيد دخول السيدة العذراء الهيكل","11-16":"عيد صعود جسد السيدة العذراء","10-5":"عيد الرسل"};
  if(F[m+"-"+k])out.push(F[m+"-"+k]);
  if(off===0)out.push("عيد القيامة المجيد");else if(off===-7)out.push("أحد الشعانين");else if(off===39)out.push("عيد الصعود المجيد");else if(off===49)out.push("عيد العنصرة");
  if(off>=-70&&off<=-68)out.push("صوم يونان");
  else if(off>=-55&&off<=-8)out.push("الصوم الكبير");
  else if(off>=-7&&off<=-1)out.push("أسبوع الآلام");
  else if(off>=1&&off<=49)out.push("الخمسين المقدسة");
  else if(off>=50&&off<=130&&m>=7&&(m<10||(m===10&&k<=4)))out.push("صوم الرسل");
  if((m===2&&k>=16)||(m===3&&k<=28))out.push("صوم الميلاد");
  if(m===3)out.unshift("شهر كيهك");
  if(m===11&&k<=15)out.push("صوم السيدة العذراء");
  return out}
